<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Barbería "ALIAS"</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    /* =========================
       FONDO GENERAL
       ========================= */

    body {
      background:
        linear-gradient(
          180deg,
          #7d8792 0%,
          #69747f 28%,
          #505b66 55%,
          #38434d 78%,
          #252d35 100%
        );
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      color: #ffffff;
    }

    /* =========================
       CONTENEDOR
       ========================= */

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* =========================
       TÍTULO
       ========================= */

    .title {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 16px;
      text-align: center;
      color: #c9184a;
      letter-spacing: -0.5px;
      text-shadow:
        0 4px 8px rgba(0, 0, 0, 0.30);
    }

    /* =========================
       AVATAR / LOGO
       ========================= */

    .avatar-container {
      width: 155px;
      height: 155px;
      border-radius: 50%;
      background:
        linear-gradient(
          145deg,
          #12bfd0 0%,
          #08aebe 45%,
          #087f91 100%
        );
      border: 5px solid #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.28);
      overflow: hidden; /* Evita que la imagen se salga del círculo */
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ajusta la foto sin deformarla */
    }

    /* =========================
       BOTONES PRINCIPALES
       ========================= */

    .link-btn {
      width: 100%;
      padding: 18px 24px;
      border-radius: 50px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.025);
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition:
        background-color 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;
      cursor: pointer;
    }

    .link-btn:hover {
      background-color:
        rgba(255, 255, 255, 0.10);
      transform: scale(1.02);
      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.20);
    }

    .link-btn svg {
      position: absolute;
      left: 20px;
      width: 25px;
      height: 25px;
      fill: currentColor;
    }

    /* =========================
       WHATSAPP
       ========================= */

    .whatsapp-icon {
      color: #25D366;
    }

    /* =========================
       SECCIONES
       ========================= */

    .section-label {
      width: 100%;
      text-align: left;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.78);
      margin-top: 12px;
      margin-bottom: -5px;
    }

    /* =========================
       MENÚ DESPLEGABLE (Dropdown)
       ========================= */

    .dropdown {
      width: 100%;
      position: relative;
    }

    .dropdown-btn {
      width: 100%;
    }

    .dropdown-btn .arrow {
      position: absolute;
      right: 20px;
      left: auto;
      transition: transform 0.3s ease;
    }

    .dropdown-content {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      padding-left: 15px;
      padding-right: 15px;
    }

    .dropdown.active .dropdown-content {
      display: flex;
    }

    .dropdown.active .arrow {
      transform: rotate(180deg);
    }

    .sub-btn {
      padding: 14px 20px;
      font-size: 15px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.07);
    }

    /* =========================
       REDES SOCIALES
       ========================= */

    .social-row {
      display: flex;
      gap: 18px;
      justify-content: center;
      width: 100%;
      margin-top: 2px;
    }

    .social-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .social-icon svg {
      width: 29px;
      height: 29px;
      fill: currentColor;
    }

    .facebook { background: #1877F2; color: #ffffff; }
    .facebook:hover { transform: scale(1.10); box-shadow: 0 0 18px rgba(24, 119, 242, 0.60); }
    .tiktok { background: #111111; color: #ffffff; }
    .tiktok:hover { transform: scale(1.10); box-shadow: 0 0 18px rgba(255, 255, 255, 0.35); }
    .instagram { background: linear-gradient(135deg, #833AB4 0%, #C13584 35%, #E1306C 55%, #F77737 75%, #FFDC80 100%); color: #ffffff; }
    .instagram:hover { transform: scale(1.10); box-shadow: 0 0 18px rgba(225, 48, 108, 0.60); }
    .youtube { background: #FF0000; color: #ffffff; }
    .youtube:hover { transform: scale(1.10); box-shadow: 0 0 18px rgba(255, 0, 0, 0.60); }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 480px) {
      body { padding: 30px 16px; }
      .title { font-size: 36px; }
      .avatar-container { width: 155px; height: 155px; }
      .social-row { gap: 14px; }
      .social-icon { width: 55px; height: 55px; }
    }
  </style>
</head>

<body>

      <div class="dropdown-content">

        <a href="#" class="link-btn sub-btn">Cejas</a>
        <a href="#" class="link-btn sub-btn">Otros</a>

  </div>

  <script>
    function toggleLocation() {
      const dropdown = document.getElementById('locationDropdown');
      dropdown.classList.toggle('active');
    }

    function toggleServices() {
      const dropdown = document.getElementById('servicesDropdown');
      dropdown.classList.toggle('active');
    }
  </script>
